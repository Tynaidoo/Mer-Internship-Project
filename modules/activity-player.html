<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Interactive Activity | MER Internship Project</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>:root{--gold:#c99a3b;--gold-light:#e3c36e;--gold-dark:#8a6425;--ink:#181818;--paper:#f7f5ef;--line:#e7e0d4}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65}a{text-decoration:none;color:inherit}.top{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(20px,5vw,72px);background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}.back{border:1px solid #d9cfbc;padding:10px 16px;border-radius:999px;font-weight:800;font-size:.85rem}.hero{background:linear-gradient(120deg,#101010,#2a2318);color:#fff;padding:56px clamp(22px,8vw,110px)}.kicker{font-size:.72rem;letter-spacing:.17em;text-transform:uppercase;color:var(--gold-light);font-weight:800}.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.3rem,5vw,4.4rem);line-height:1.02;letter-spacing:-.04em;margin:12px 0}.hero p{max-width:780px;color:#ded7ca}.wrap{max-width:980px;margin:auto;padding:46px 22px 90px}.activity-shell{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,38px);box-shadow:0 18px 50px rgba(0,0,0,.07)}.activity-shell .activity{background:transparent!important;border:0!important;padding:0!important;margin:0!important;box-shadow:none!important}.activity-shell h2,.activity-shell h3{font-family:'Space Grotesk',sans-serif}.activity-shell table{width:100%;border-collapse:collapse;margin:20px 0}.activity-shell th,.activity-shell td{border:1px solid var(--line);padding:12px;vertical-align:top}.activity-shell th{background:#f5f0e4}.activity-shell textarea,.activity-shell input[type=text],.activity-shell select{width:100%;padding:11px;border:1px solid #d9cfbd;border-radius:9px;font:inherit;background:#fff}.activity-shell input[type=radio],.activity-shell input[type=checkbox]{accent-color:var(--gold);transform:scale(1.15);margin-right:7px}.activity-shell label{cursor:pointer}.editable{min-height:52px;background:#fff;outline:none;border:1px dashed #cdbf9f;border-radius:8px;padding:8px}.editable:empty:before{content:'Type your response…';color:#aaa}.progress-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:10px;font-size:.8rem;font-weight:800}.track{height:7px;background:#ece5d8;border-radius:99px;overflow:hidden;margin-bottom:28px}.fill{height:100%;width:0;background:var(--gold);transition:width .25s}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{border:0;border-radius:999px;padding:12px 17px;font:800 .84rem Inter;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee7dc;color:#4f4432}.feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:12px;background:#f7f5ef;border-left:4px solid var(--gold)}.feedback.show{display:block}.loading{text-align:center;padding:80px 20px;color:#666}.error{padding:22px;border:1px solid #e0caca;background:#fff5f5;border-radius:16px}footer{padding:28px;text-align:center;color:#777;font-size:.8rem}@media(max-width:650px){.top{align-items:flex-start}.activity-shell{border-radius:18px}.actions{flex-direction:column}.btn{width:100%}}</style></head><body><header class="top"><strong>MER Internship Project</strong><a id="back" class="back" href="index.html">← Back to session</a></header><section class="hero"><span class="kicker" id="kicker">Interactive activity</span><h1 id="title">Activity</h1><p>Complete the activity below. Your responses are saved on this device so you can return and continue.</p></section><main class="wrap"><div class="progress-head"><span>Activity progress</span><span id="pct">0% complete</span></div><div class="track"><div class="fill" id="fill"></div></div><div id="mount" class="activity-shell"><div class="loading">Loading activity…</div></div><div class="actions"><button class="btn primary" id="save" type="button">Save my response</button><button class="btn secondary" id="reset" type="button">Reset activity</button><a class="btn secondary" id="return" href="index.html">Return to session</a></div><div id="feedback" class="feedback" role="status"></div></main><footer>MER Internship Project · Interactive learning activity</footer><script>(()=>{const q=new URLSearchParams(location.search),session=q.get('session'),num=Math.max(0,parseInt(q.get('activity')||'0',10));const mount=document.getElementById('mount'),back=document.getElementById('back'),ret=document.getElementById('return'),title=document.getElementById('title'),kicker=document.getElementById('kicker'),pct=document.getElementById('pct'),fill=document.getElementById('fill'),feedback=document.getElementById('feedback');if(!session||!/^[a-z0-9-]+\.html$/i.test(session)){mount.innerHTML='<div class="error">This activity link is incomplete. Please return to the course menu and open the activity again.</div>';return}back.href=ret.href=session;const key=`mer-activity:${session}:${num}`;fetch(session,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html'),acts=[...doc.querySelectorAll('.activity')].filter(a=>!a.querySelector('a[href*="gautengpestcontrol.chatgpt.site"]')),src=acts[num];if(!src)throw Error();src.querySelectorAll('.ia-top,.ia-progress-track,.ia-actions,.ia-feedback').forEach(x=>x.remove());src.classList.remove('interactive-ready','ia-complete');mount.innerHTML='';mount.appendChild(document.importNode(src,true));const h=mount.querySelector('h2,h3'),badge=mount.querySelector('.badge');title.textContent=h?h.textContent.trim():(badge?badge.textContent.trim():'Interactive Activity');kicker.textContent=`${session.replace('.html','').replaceAll('-',' ')} · Interactive activity`;[...mount.querySelectorAll('td')].forEach(td=>{if(!td.textContent.trim()&&!td.querySelector('input,textarea,select,button,a,img')){td.contentEditable='true';td.classList.add('editable')}});[...mount.querySelectorAll('p,div')].forEach(el=>{if(el.children.length===0&&/^\s*[_–—.]{4,}\s*$/.test(el.textContent)){el.textContent='';el.contentEditable='true';el.classList.add('editable')}});[...mount.querySelectorAll('tbody tr')].forEach(row=>{const cs=[...row.querySelectorAll('input[type=checkbox]')];if(cs.length>1)cs.forEach(c=>c.addEventListener('change',()=>{if(c.checked)cs.forEach(o=>{if(o!==c)o.checked=false});save();progress()}))});const controls=()=>[...mount.querySelectorAll('input:not([type=button]):not([type=submit]),textarea,select,.editable')],val=c=>c.classList.contains('editable')?c.innerHTML:(c.type==='checkbox'||c.type==='radio'?c.checked:c.value),set=(c,v)=>{if(c.classList.contains('editable'))c.innerHTML=v||'';else if(c.type==='checkbox'||c.type==='radio')c.checked=!!v;else c.value=v||''},answered=c=>c.classList.contains('editable')?c.textContent.trim().length>0:(c.type==='checkbox'||c.type==='radio'?c.checked:String(c.value||'').trim().length>0);function save(){try{localStorage.setItem(key,JSON.stringify(controls().map(val)))}catch(e){}}function restore(){try{const a=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(a))controls().forEach((c,i)=>set(c,a[i]))}catch(e){}}function progress(){const cs=controls(),names=[...new Set(cs.filter(c=>c.type==='radio').map(c=>c.name).filter(Boolean))],other=cs.filter(c=>c.type!=='radio'),total=other.length+names.length,done=other.filter(answered).length+names.filter(n=>[...mount.querySelectorAll('input[type=radio]')].some(c=>c.name===n&&c.checked)).length,p=total?Math.round(done/total*100):0;pct.textContent=`${p}% complete`;fill.style.width=p+'%';return p}restore();progress();mount.addEventListener('input',()=>{save();progress()});mount.addEventListener('change',()=>{save();progress()});document.getElementById('save').onclick=()=>{save();const p=progress();feedback.textContent=p===100?'Response saved — activity complete. Review your responses before returning to the session.':p?`Response saved — ${p}% complete.`:'Start the activity by making a selection or entering a response.';feedback.classList.add('show')};document.getElementById('reset').onclick=()=>{controls().forEach(c=>set(c,c.type==='checkbox'||c.type==='radio'?false:''));localStorage.removeItem(key);progress();feedback.textContent='Activity reset. You can start again.';feedback.classList.add('show')}}).catch(()=>{mount.innerHTML='<div class="error">This activity could not be loaded. Please return to the session and try again.</div>'})})();</script></body></html>
