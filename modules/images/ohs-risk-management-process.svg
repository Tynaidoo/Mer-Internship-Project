<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><rect width="1100" height="650" rx="24" fill="#f2f7fa"/><rect x="18" y="18" width="1064" height="614" rx="18" fill="#fff" stroke="#d4e1e8"/><rect x="18" y="18" width="1064" height="100" rx="18" fill="#264a68"/><text x="550" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#fff">THE RISK-MANAGEMENT PROCESS</text><text x="550" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e4f3ff">A basic guide for workplace safety</text><g font-family="Arial,sans-serif"><rect x="45" y="170" width="300" height="142" rx="18" fill="#dceef8" stroke="#7eb2d1" stroke-width="2"/><text x="195" y="212" text-anchor="middle" font-size="24" font-weight="bold" fill="#163d5d">1. IDENTIFY HAZARDS</text><text x="195" y="252" text-anchor="middle" font-size="19" fill="#163d5d">What could cause harm?</text><rect x="400" y="170" width="300" height="142" rx="18" fill="#dcf2e7" stroke="#79bd9a" stroke-width="2"/><text x="550" y="212" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b6147">2. ASSESS THE RISK</text><text x="550" y="252" text-anchor="middle" font-size="18" fill="#1b6147">How likely and how serious?</text><rect x="755" y="170" width="300" height="142" rx="18" fill="#fff0ce" stroke="#e4bd63" stroke-width="2"/><text x="905" y="212" text-anchor="middle" font-size="24" font-weight="bold" fill="#825918">3. APPLY CONTROLS</text><text x="905" y="249" text-anchor="middle" font-size="18" fill="#825918">Eliminate or reduce risk</text><rect x="220" y="400" width="300" height="142" rx="18" fill="#f9e5dd" stroke="#d89d82" stroke-width="2"/><text x="370" y="442" text-anchor="middle" font-size="24" font-weight="bold" fill="#88472c">5. REVIEW</text><text x="370" y="482" text-anchor="middle" font-size="18" fill="#88472c">Are controls effective?</text><rect x="580" y="400" width="300" height="142" rx="18" fill="#e7e7f7" stroke="#a6a4d4" stroke-width="2"/><text x="730" y="442" text-anchor="middle" font-size="22" font-weight="bold" fill="#444178">4. REPORT &amp; DOCUMENT</text><text x="730" y="482" text-anchor="middle" font-size="18" fill="#444178">Record hazards and actions</text></g><g stroke="#9e8a67" stroke-width="6" fill="none" stroke-linecap="round"><path d="M350 242H392"/><path d="M380 232l12 10-12 10"/><path d="M705 242H747"/><path d="M735 232l12 10-12 10"/><path d="M905 318V369H730V390"/><path d="M720 378l10 12 10-12"/><path d="M573 471H528"/><path d="M540 461l-12 10 12 10"/><path d="M220 471H105V330H195V320"/><path d="M185 332l10-12 10 12"/></g><text x="550" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#34516a">STAY SAFE. WORK SMART.</text></svg>