<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="t d"><title id="t">Anatomy of a Phishing Email</title><desc id="d">Five warning signs: mismatched sender address, generic greeting, urgent pressure, suspicious links or attachments, and inconsistent formatting or grammar.</desc><rect width="1000" height="670" rx="24" fill="#eff5fa"/><rect x="20" y="20" width="960" height="630" rx="20" fill="#fff" stroke="#bdd0de" stroke-width="3"/><rect x="20" y="20" width="960" height="105" rx="20" fill="#123b61"/><rect x="20" y="105" width="960" height="20" fill="#123b61"/><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="34" fill="#fff">ANATOMY OF A PHISHING EMAIL</text><text x="500" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#d5eafa">Five common warning signs</text><rect x="215" y="172" width="570" height="365" rx="16" fill="#f8fbfd" stroke="#8ba5b7" stroke-width="3"/><rect x="215" y="172" width="570" height="42" rx="16" fill="#dae7f0"/><text x="240" y="200" font-family="Arial,sans-serif" font-size="18" fill="#183b56">✉  Inbox / Message</text><text x="245" y="248" font-family="Arial,sans-serif" font-size="19" fill="#203b4f">From: Support &lt;verify@company-help-alert.com&gt;</text><text x="245" y="289" font-family="Arial,sans-serif" font-size="19" fill="#203b4f">Subject: URGENT: Account will be disabled</text><line x1="238" y1="307" x2="762" y2="307" stroke="#c6d4df"/><text x="245" y="347" font-family="Arial,sans-serif" font-size="19" fill="#203b4f">Dear User,</text><text x="245" y="388" font-family="Arial,sans-serif" font-size="18" fill="#203b4f">You must verify your password in 30 minutes</text><text x="245" y="416" font-family="Arial,sans-serif" font-size="18" fill="#203b4f">or your account will be suspended.</text><rect x="245" y="444" width="235" height="44" rx="8" fill="#c04439"/><text x="362" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Verify account now</text><g font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#113b61"><rect x="35" y="175" width="166" height="82" rx="12" fill="#e5f1fa" stroke="#8aaec7"/><text x="118" y="207" text-anchor="middle">1. Sender</text><text x="118" y="231" text-anchor="middle">mismatch</text><rect x="799" y="193" width="166" height="82" rx="12" fill="#e5f1fa" stroke="#8aaec7"/><text x="882" y="225" text-anchor="middle">2. Artificial</text><text x="882" y="249" text-anchor="middle">urgency</text><rect x="35" y="335" width="166" height="82" rx="12" fill="#e5f1fa" stroke="#8aaec7"/><text x="118" y="367" text-anchor="middle">3. Generic</text><text x="118" y="391" text-anchor="middle">greeting</text><rect x="799" y="397" width="166" height="82" rx="12" fill="#e5f1fa" stroke="#8aaec7"/><text x="882" y="429" text-anchor="middle">4. Suspicious</text><text x="882" y="453" text-anchor="middle">links/files</text><rect x="318" y="560" width="364" height="60" rx="12" fill="#e5f1fa" stroke="#8aaec7"/><text x="500" y="585" text-anchor="middle">5. Inconsistent formatting,</text><text x="500" y="608" text-anchor="middle">language or grammar</text></g><g stroke="#d35b44" stroke-width="3" fill="none"><path d="M201 215L235 239"/><path d="M799 234L699 283"/><path d="M201 373L245 345"/><path d="M799 438L480 466"/><path d="M500 560L610 510"/></g></svg>