<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-label="PART 2: HOSTING A JOURNAL CLUB"><rect width="900" height="790" fill="#f6f7fb"/><rect x="30" y="24" width="840" height="742" rx="22" fill="#fff" stroke="#c9d5e2"/><rect x="30" y="24" width="840" height="92" rx="22" fill="#072956"/><rect x="30" y="88" width="840" height="28" fill="#072956"/><text x="450" y="80" text-anchor="middle" fill="#fff" font-size="30" font-family="Arial,sans-serif" font-weight="bold">PART 2: HOSTING A JOURNAL CLUB</text><text x="450" y="148" text-anchor="middle" fill="#1a3455" font-size="19" font-family="Arial,sans-serif">Investigate a workplace challenge using credible evidence</text><g font-family="Arial,sans-serif"><rect x="65" y="170" width="770" height="79" rx="15" fill="#fff" stroke="#c9d5e2"/><circle cx="111" cy="209" r="23" fill="#057f75"/><text x="111" y="217" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">1</text><text x="157" y="217" fill="#122b4b" font-size="24" font-weight="700">Define a focused topic</text><rect x="65" y="270" width="770" height="79" rx="15" fill="#f4f7fb" stroke="#c9d5e2"/><circle cx="111" cy="309" r="23" fill="#057f75"/><text x="111" y="317" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">2</text><text x="157" y="317" fill="#122b4b" font-size="24" font-weight="700">Clarify the problem</text><rect x="65" y="370" width="770" height="79" rx="15" fill="#fff" stroke="#c9d5e2"/><circle cx="111" cy="409" r="23" fill="#057f75"/><text x="111" y="417" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">3</text><text x="157" y="417" fill="#122b4b" font-size="24" font-weight="700">Ask key questions</text><rect x="65" y="470" width="770" height="79" rx="15" fill="#f4f7fb" stroke="#c9d5e2"/><circle cx="111" cy="509" r="23" fill="#057f75"/><text x="111" y="517" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">4</text><text x="157" y="517" fill="#12