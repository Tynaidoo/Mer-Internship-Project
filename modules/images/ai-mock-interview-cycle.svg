<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-label="THE AI MOCK INTERVIEW CYCLE"><rect width="900" height="680" fill="#f7f7fa"/><rect x="40" y="24" width="820" height="630" rx="24" fill="#fff" stroke="#cbd6e1" stroke-width="3"/><rect x="40" y="24" width="820" height="100" rx="23" fill="#11367c"/><rect x="40" y="100" width="820" height="24" fill="#11367c"/><text x="450" y="88" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="33" font-weight="bold">THE AI MOCK INTERVIEW CYCLE</text><text x="450" y="163" text-anchor="middle" fill="#35465b" font-family="Arial,sans-serif" font-size="19">Prepare → Interview → Feedback → Reflect → Retry</text><rect x="72" y="189" width="756" height="72" rx="12" fill="#eaf6f3" stroke="#b9d4ce"/><circle cx="114" cy="225" r="23" fill="#087a70"/><text x="114" y="234" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">1</text><text x="160" y="217" fill="#086b62" font-family="Arial,sans-serif" font-size="23" font-weight="bold">SET UP</text><text x="160" y="241" fill="#334155" font-family="Arial,sans-serif" font-size="17">Provide role, experience level and interview type.</text><rect x="72" y="275" width="756" height="72" rx="12" fill="#eaf6f3" stroke="#b9d4ce"/><circle cx="114" cy="311" r="23" fill="#087a70"/><text x="114" y="320" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">2</text><text x="160" y="303" fill="#086b62" font-family="Arial,sans-serif" font-size="23" font-weight="bold">SPEAK</text><text x="160" y="327" fill="#334155" font-family="Arial,sans-serif" font-size="17">Use voice mode, if available, or type your answers.</text><rect x="72" y="361" width="756" height="72" rx="12" fill="#eaf6f3" stroke="#b9d4ce"/><circle cx="114" cy="397" r="23" fill="#087a70"/><text x="114" y="406" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">3</text><text x="160" y="389" fill="#086b62" font-family="Arial,sans-serif" font-size="23" font-weight="bold">RESPOND</text><text x="160" y="413" fill="#334155" font-family="Arial,sans-serif" font-size="17">Answer one question at a time using specific examples.</text><rect x="72" y="447" width="756" height="72" rx="12" fill="#eaf6f3" stroke="#b9d4ce"/><circle cx="114" cy="483" r="23" fill="#087a70"/><text x="114" y="492" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">4</text><text x="160" y="475" fill="#086b62" font-family="Arial,sans-serif" font-size="23" font-weight="bold">REVIEW</text><text x="160" y="499" fill="#334155" font-family="Arial,sans-serif" font-size="17">Request feedback on clarity, relevance and structure.</text><rect x="72" y="533" width="756" height="72" rx="12" fill="#eaf6f3" stroke="#b9d4ce"/><circle cx="114" cy="569" r="23" fill="#087a70"/><text x="114" y="578" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">5</text><text x="160" y="561" fill="#086b62" font-family="Arial,sans-serif" font-size="23" font-weight="bold">RETRY</text><text x="160" y="585" fill="#334155" font-family="Arial,sans-serif" font-size="17">Improve an answer and practise again.</text></svg>